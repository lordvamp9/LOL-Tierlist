name: Release LOL META Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Tauri Desktop Client & Publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LOL META Release ${{ github.ref_name }}'
          releaseBody: |
            ## LOL META Desktop Client - Release ${{ github.ref_name }}
            
            ### Correccion Critica de Datos y Mejoras de Arquitectura:
            - **Correccion de Datos Reales:** Se subsano un error de programacion previo donde el cliente utilizaba datos simulados (mocks) hardcodeados debido a bloqueos de Cloudflare. A partir de esta version, la aplicacion consume datos 100% veridicos y reales del meta actual sincronizados directamente desde OP.GG y Riot Games Data Dragon a traves de la CDN de GitHub.
            - **Arquitectura Desacoplada:** Backend Rust/Tauri optimizado para consultar archivos JSON estructurados sin riesgo de bloqueos.
            - **Cliente Season 3 (2013):** Diseno retro clasico fiel de League of Legends.
            - **Top 5 Meta Real:** Algoritmo ponderado anti-niche picks para el parche activo.
            - **Filtros Funcionales:** Selector de Servidor (LAS, LAN, NA, EUW, KR, BR) y Rango Elo (Hierro a Retador).
            - **Cache Offline Robusta:** Persistencia local en disco con TTL de 12 horas y respaldo embebido.
            - **100% Vanguard Safe:** Cero inyeccion de memoria o hooks al cliente de juego; consumo exclusivo de estadisticas publicas.
            
            ### Descarga del Instalador:
            Descarga el archivo ejecutable adjunto abajo (.exe o instalador msi) e instalalo en tu sistema Windows.
          releaseDraft: false
          prerelease: false
          args: --verbose
